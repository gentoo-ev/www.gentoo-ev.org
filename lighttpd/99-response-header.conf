server.modules += ( "mod_setenv" )

setenv.add-response-header = (
  # style-src 'unsafe-inline' is intentional: low risk for a static site,
  # and it applies only to CSS (scripts are covered by default-src)
  "Content-Security-Policy" =>
    "default-src 'self'; " +
    "style-src 'self' 'unsafe-inline'; " +
    "base-uri 'none'; " +
    "frame-ancestors 'none'",

  # Any sane protocol would just trust the Content-Type header field,
  # but apparently browsers don't work that way and do weird things
  # like MIME sniffing (https://mimesniff.spec.whatwg.org/) instead.
  # We opt out of the nonsense by adding yet another header.
  "X-Content-Type-Options" => "nosniff"
)
