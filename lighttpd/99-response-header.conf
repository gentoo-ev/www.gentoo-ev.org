server.modules += ( "mod_setenv" )

setenv.add-response-header = (
  # style-src 'unsafe-inline' is intentional: low risk for a static site,
  # and it applies only to CSS (scripts are covered by default-src)
  "Content-Security-Policy" =>
    "default-src 'self'; " +
    "style-src 'self' 'unsafe-inline'; " +
    "base-uri 'none'; " +
    "frame-ancestors 'none'"
)
